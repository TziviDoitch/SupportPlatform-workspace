# SupportPlatform — one-command run (plan §2, §6 S0-e).
# Usage: cd infra && cp .env.example .env && docker compose up
name: supportplatform

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in infra/.env}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # sqlcmd moved to mssql-tools18 mid-2022; accept either path. -C trusts the self-signed cert.
      test: ["CMD-SHELL", "SQLCMD=$$(ls /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd 2>/dev/null | head -1); $$SQLCMD -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ../server
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__SqlServer: "Server=db,1433;Database=SupportPlatform;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
    ports:
      - "5080:8080"
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ../client
    environment:
      # Vite dev server proxies /api/* to the api container (see client/vite.config.ts).
      VITE_API_PROXY_TARGET: "http://api:8080"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  mssql-data:
